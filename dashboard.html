<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Atlas Business Dashboard - Gerencie suas ferramentas empresariais">
    <meta name="theme-color" content="#0a0a0a">
    <title>Dashboard — Atlas Business</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/svg+xml" href="assets/icons/favicon.svg">
</head>
<body class="light-mode">
    <!-- Container da Sidebar -->
    <div id="sidebarContainer"></div>

    <!-- Conteúdo principal do Dashboard -->
    <main class="dashboard-main" id="dashboardMain">
        <header class="dashboard-topbar">
            <div class="dashboard-topbar__breadcrumb" id="breadcrumb">
                <span>Dashboard</span>
            </div>
            <div class="dashboard-topbar__actions">
                <button class="btn btn--outline btn--sm" id="themeToggleDashboard" aria-label="Alternar tema">
                    <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/>
                    </svg>
                    <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
                        <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
                    </svg>
                </button>
                <div class="dashboard-user">
                    <span class="dashboard-user__name">Empresa Demo</span>
                    <div class="dashboard-user__avatar">ED</div>
                </div>
            </div>
        </header>

        <!-- Área de conteúdo dinâmico das ferramentas -->
        <div class="dashboard-content" id="dashboardContent">
            <!-- Conteúdo inicial: boas-vindas ou ferramenta ativa -->
            <div class="dashboard-welcome">
                <div class="welcome-card">
                    <h2>Bem-vindo ao Atlas Business</h2>
                    <p>Selecione uma ferramenta no menu lateral para começar a criar documentos profissionais.</p>
                    <div class="welcome-tools-grid">
                        <div class="welcome-tool" onclick="navigateTo('propostas')">
                            <span class="welcome-tool__icon">📄</span>
                            <span>Propostas</span>
                        </div>
                        <div class="welcome-tool" onclick="navigateTo('orcamentos')">
                            <span class="welcome-tool__icon">📊</span>
                            <span>Orçamentos</span>
                        </div>
                        <div class="welcome-tool" onclick="navigateTo('contratos')">
                            <span class="welcome-tool__icon">📝</span>
                            <span>Contratos</span>
                        </div>
                        <div class="welcome-tool" onclick="navigateTo('relatorios')">
                            <span class="welcome-tool__icon">📈</span>
                            <span>Relatórios</span>
                        </div>
                        <div class="welcome-tool" onclick="navigateTo('calculadora')">
                            <span class="welcome-tool__icon">🔢</span>
                            <span>Calculadora</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast container -->
    <div class="toast-container" id="toastContainer" aria-live="polite"></div>

    <!-- Scripts -->
    <script src="js/main.js"></script>
    <script src="js/theme.js"></script>
    <script src="components/Sidebar.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
